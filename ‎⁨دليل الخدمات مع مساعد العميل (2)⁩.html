<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<meta name="theme-color" content="#173B2C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="دليل الخدمات">
<title>دليل الخدمات الحكومية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F3EC;
    --ink:#1C2620;
    --ink-soft:#4B564D;
    --emerald:#25543F;
    --emerald-deep:#173B2C;
    --emerald-pale:#EFF5F0;
    --emerald-line:#D3E3D6;
    --sand:#B4863A;
    --sand-pale:#FBF3E6;
    --sand-line:#EAD8B0;
    --terracotta:#A8462F;
    --terracotta-pale:#FBF1EC;
    --terracotta-line:#EAD2C6;
    --card:#FFFFFF;
    --line:#E1DACB;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans Arabic', 'Segoe UI', sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  #app{
    max-width:960px;
    margin:0 auto;
    padding-bottom:48px;
    min-height:100vh;
  }

  /* ===== Header ===== */
  header{
    position:sticky;
    top:0;
    z-index:20;
    background:var(--emerald-deep);
    color:#fff;
    padding:14px 18px 16px;
    box-shadow:0 2px 10px rgba(0,0,0,.14);
  }
  .header-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .back-btn{
    display:none;
    align-items:center;
    justify-content:center;
    width:38px;
    height:38px;
    border-radius:10px;
    background:rgba(255,255,255,.14);
    border:none;
    color:#fff;
    font-size:20px;
    cursor:pointer;
    flex-shrink:0;
  }
  .back-btn:active{background:rgba(255,255,255,.26);}
  .header-title{
    font-size:17px;
    font-weight:700;
    flex:1;
    line-height:1.3;
  }
  .header-sub{
    font-size:12.5px;
    color:#CFE0D4;
    font-weight:400;
    margin-top:2px;
  }
  .search-wrap{
    margin-top:12px;
    position:relative;
  }
  .search-wrap input{
    width:100%;
    padding:12px 44px 12px 14px;
    border-radius:12px;
    border:none;
    background:#fff;
    font-family:inherit;
    font-size:15px;
    color:var(--ink);
    outline:none;
  }
  .search-wrap input::placeholder{color:#9AA69C;}
  .search-icon{
    position:absolute;
    right:14px;
    top:50%;
    transform:translateY(-50%);
    color:#7C8B7E;
    pointer-events:none;
  }
  .clear-search{
    position:absolute;
    left:10px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    color:#9AA69C;
    font-size:18px;
    cursor:pointer;
    display:none;
    padding:4px;
  }

  main{padding:18px;}

  /* ===== Home: platform grid ===== */
  .section-label{
    font-size:13px;
    color:var(--ink-soft);
    margin:4px 2px 12px;
    font-weight:500;
  }
  .stat-row{
    display:flex;
    gap:10px;
    margin-bottom:18px;
  }
  .stat-chip{
    flex:1;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px 8px;
    text-align:center;
  }
  .stat-chip .num{font-size:19px;font-weight:700;color:var(--emerald-deep);}
  .stat-chip .lbl{font-size:11px;color:var(--ink-soft);margin-top:2px;}

  .platform-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  @media (max-width:420px){
    .platform-grid{grid-template-columns:1fr;}
  }
  .platform-card{
    background:var(--card);
    border:1px solid var(--line);
    border-right:4px solid var(--emerald);
    border-radius:var(--radius);
    padding:16px;
    display:flex;
    align-items:flex-start;
    gap:12px;
    cursor:pointer;
    text-align:right;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .platform-card:active{
    transform:scale(.98);
    box-shadow:0 2px 6px rgba(0,0,0,.06);
  }
  .platform-num{
    flex-shrink:0;
    width:34px;
    height:34px;
    border-radius:10px;
    background:var(--emerald);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    font-size:15px;
  }
  .platform-info{flex:1;min-width:0;}
  .platform-name{
    font-weight:600;
    font-size:15.5px;
    margin-bottom:3px;
  }
  .platform-count{
    font-size:12.5px;
    color:var(--ink-soft);
  }

  /* ===== Service list ===== */
  .service-list{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .service-row{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:13px 14px;
    display:flex;
    align-items:center;
    gap:12px;
    cursor:pointer;
  }
  .service-row:active{background:#F1EEE5;}
  .service-num{
    flex-shrink:0;
    width:28px;
    height:28px;
    border-radius:8px;
    background:var(--paper);
    border:1px solid var(--line);
    color:var(--emerald-deep);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    font-size:13px;
  }
  .service-main{flex:1;min-width:0;}
  .service-name{
    font-size:15px;
    font-weight:500;
    line-height:1.4;
  }
  .service-meta{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:4px;
  }
  .service-platform-tag{
    font-size:11px;
    color:var(--sand);
    font-weight:600;
  }
  .meta-pill{
    font-size:10.5px;
    color:var(--ink-soft);
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:20px;
    padding:1px 8px;
  }
  .meta-pill.fee{
    color:#8A5A16;
    background:var(--sand-pale);
    border-color:var(--sand-line);
  }
  .chevron{
    color:#B7AF9E;
    flex-shrink:0;
    font-size:14px;
  }

  .empty-state{
    text-align:center;
    padding:50px 20px;
    color:var(--ink-soft);
  }
  .empty-state .big{font-size:32px;margin-bottom:10px;}

  /* ===== Detail screen ===== */
  .detail-title{
    font-size:20px;
    font-weight:700;
    margin-bottom:4px;
    line-height:1.35;
  }
  .detail-platform{
    font-size:13px;
    color:var(--sand);
    font-weight:600;
    margin-bottom:18px;
  }

  .block-label{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    font-size:13.5px;
    font-weight:700;
    color:var(--emerald-deep);
    margin:22px 0 10px;
  }
  .block-label:first-of-type{margin-top:0;}
  .block-label-text{display:flex;align-items:center;gap:8px;}
  .block-icon{
    width:22px;height:22px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }

  /* fee chips */
  .fee-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:12px;
  }
  .fee-chip{
    background:var(--sand-pale);
    border:1px solid var(--sand-line);
    color:#8A5A16;
    font-weight:700;
    font-size:13px;
    padding:6px 12px;
    border-radius:20px;
    display:flex;
    align-items:center;
    gap:5px;
  }

  /* conditions as checklist */
  .cond-list{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .cond-item{
    display:flex;
    align-items:flex-start;
    gap:12px;
    background:var(--terracotta-pale);
    border:1px solid var(--terracotta-line);
    border-radius:12px;
    padding:12px 14px;
    cursor:pointer;
    transition:background .12s ease, opacity .12s ease;
  }
  .cond-item:active{background:#F7E4DA;}
  .cond-badge{
    flex-shrink:0;
    width:24px;
    height:24px;
    border-radius:50%;
    background:var(--terracotta);
    color:#fff;
    font-size:13px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-top:1px;
    transition:background .15s ease;
  }
  .cond-text{
    flex:1;
    font-size:14.3px;
    line-height:1.6;
    color:#6E3220;
  }
  .cond-item.done{opacity:.5;}
  .cond-item.done .cond-badge{background:#B98A73;}
  .cond-item.done .cond-text{text-decoration:line-through;}

  .script-card{
    background:var(--emerald-pale);
    border:1px solid var(--emerald-line);
    border-radius:14px;
    padding:16px;
    font-size:15.5px;
    line-height:1.75;
    color:var(--emerald-deep);
    position:relative;
  }
  .script-card::before{
    content:"\201C";
    position:absolute;
    top:-6px;
    right:16px;
    font-size:40px;
    color:#C9DECD;
    font-family:Georgia, serif;
  }

  .steps-list{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .step-item{
    display:flex;
    align-items:flex-start;
    gap:12px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    cursor:pointer;
    transition:background .12s ease, opacity .12s ease;
  }
  .step-item:active{background:#F1EEE5;}
  .step-badge{
    flex-shrink:0;
    width:26px;
    height:26px;
    border-radius:50%;
    background:var(--emerald);
    color:#fff;
    font-size:12.5px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-top:1px;
    transition:background .15s ease;
  }
  .step-text{
    flex:1;
    font-size:14.8px;
    line-height:1.65;
  }
  .step-item.done{opacity:.5;}
  .step-item.done .step-badge{background:var(--sand);}
  .step-item.done .step-text{text-decoration:line-through;}

  .reset-link{
    background:none;
    border:none;
    color:var(--ink-soft);
    font-family:inherit;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
    text-decoration:underline;
    padding:0;
  }

  .hidden{display:none !important;}
</style>

<style>
  .client-chat{
    margin: 18px;
    background: var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px;
    box-shadow:0 2px 8px rgba(0,0,0,.04);
  }
  .client-chat-title{
    font-size:16px;
    font-weight:700;
    color:var(--emerald-deep);
    margin-bottom:5px;
  }
  .client-chat-sub{
    font-size:12.5px;
    color:var(--ink-soft);
    line-height:1.6;
    margin-bottom:12px;
  }
  .client-chat-row{display:flex;gap:8px}
  .client-chat-input{
    flex:1;
    min-width:0;
    border:1px solid var(--line);
    border-radius:12px;
    padding:11px 12px;
    font-family:inherit;
    font-size:14px;
    outline:none;
    background:#fff;
  }
  .client-chat-input:focus{border-color:var(--emerald)}
  .client-chat-btn{
    border:0;
    border-radius:12px;
    padding:0 15px;
    background:var(--emerald);
    color:#fff;
    font-family:inherit;
    font-weight:700;
    cursor:pointer;
  }
  .client-chat-btn:active{transform:scale(.98)}
  .quick-asks{
    display:flex;flex-wrap:wrap;gap:7px;margin-top:10px
  }
  .quick-ask{
    border:1px solid var(--emerald-line);
    background:var(--emerald-pale);
    color:var(--emerald-deep);
    border-radius:20px;
    padding:6px 10px;
    font-family:inherit;
    font-size:11.5px;
    cursor:pointer;
  }
  .chat-result{
    margin-top:12px;
    display:none;
    background:var(--emerald-pale);
    border:1px solid var(--emerald-line);
    border-radius:13px;
    padding:13px;
    color:var(--emerald-deep);
    line-height:1.7;
    font-size:14px;
  }
  .chat-result strong{font-weight:700}
  .chat-service{
    margin-top:9px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:11px;
    padding:10px 11px;
    cursor:pointer;
  }
  .chat-service-name{font-weight:700;font-size:14px}
  .chat-service-platform{font-size:11.5px;color:var(--sand);margin-top:2px}
  .chat-empty{color:var(--ink-soft)}
  .chat-hint{font-size:11px;color:var(--ink-soft);margin-top:7px}
</style>

<style>
  /* ===== Dark mode ===== */
  body.dark{
    --paper:#121814;
    --ink:#EAEFE8;
    --ink-soft:#9FB0A0;
    --emerald:#3B8562;
    --emerald-deep:#1E3B2C;
    --emerald-pale:#17251C;
    --emerald-line:#254A34;
    --sand:#D9A75B;
    --sand-pale:#2A2013;
    --sand-line:#4A3A1E;
    --terracotta:#C97455;
    --terracotta-pale:#2A1712;
    --terracotta-line:#4A2A1E;
    --card:#1B231D;
    --line:#2C362D;
  }
  body.dark .script-card::before{color:#274430;}

  /* ===== Header action buttons (dark toggle) ===== */
  .header-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .icon-btn{
    display:flex;align-items:center;justify-content:center;
    width:38px;height:38px;border-radius:10px;
    background:rgba(255,255,255,.14);
    border:none;color:#fff;font-size:17px;cursor:pointer;flex-shrink:0;
  }
  .icon-btn:active{background:rgba(255,255,255,.26);}

  /* ===== Favorite star ===== */
  .fav-star{
    background:none;border:none;cursor:pointer;font-size:18px;
    line-height:1;flex-shrink:0;padding:2px 4px;color:#C9C2AC;
  }
  .fav-star.active{color:var(--sand);}
  .detail-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}

  /* ===== Copy buttons ===== */
  .copy-btn{
    background:none;border:1px solid var(--emerald-line);color:var(--emerald-deep);
    font-family:inherit;font-size:11.5px;font-weight:600;cursor:pointer;
    border-radius:20px;padding:4px 10px;display:inline-flex;align-items:center;gap:4px;
  }
  body.dark .copy-btn{color:var(--emerald);}
  .copy-btn:active{opacity:.7;}
  .script-actions, .steps-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px;}

  /* ===== Site link button ===== */
  .site-link-btn{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--sand-pale);border:1px solid var(--sand-line);color:#8A5A16;
    font-size:12.5px;font-weight:700;text-decoration:none;
    border-radius:20px;padding:6px 12px;margin-bottom:16px;
  }
  body.dark .site-link-btn{color:var(--sand);}

  /* ===== Day calculator ===== */
  .daycalc{
    background:var(--emerald-pale);border:1px solid var(--emerald-line);
    border-radius:14px;padding:14px;margin:14px 0 22px;
  }
  .daycalc-title{font-size:13.5px;font-weight:700;color:var(--emerald-deep);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
  body.dark .daycalc-title{color:var(--emerald);}
  .daycalc-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .daycalc-row input[type="date"]{
    border:1px solid var(--emerald-line);border-radius:10px;padding:8px 10px;
    font-family:inherit;font-size:13.5px;background:#fff;color:var(--ink);
  }
  body.dark .daycalc-row input[type="date"]{background:#1B231D;color:var(--ink);}
  .daycalc-result{margin-top:10px;font-size:14px;font-weight:600;color:var(--emerald-deep);}
  body.dark .daycalc-result{color:var(--emerald);}
  .daycalc-result .days-left{color:var(--terracotta);}

  /* ===== Favorites section on home ===== */
  .fav-section{margin-bottom:22px;}

  /* ===== Share/copy toast ===== */
  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--emerald-deep);color:#fff;padding:10px 18px;border-radius:20px;
    font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.2);z-index:50;
    opacity:0;transition:opacity .25s ease;pointer-events:none;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="header-row">
      <button class="back-btn" id="backBtn" aria-label="رجوع">→</button>
      <div style="flex:1;min-width:0;">
        <div class="header-title" id="headerTitle">دليل الخدمات الحكومية</div>
        <div class="header-sub" id="headerSub"></div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="darkToggle" aria-label="الوضع الليلي">🌙</button>
      </div>
    </div>
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="دوّر على أي خدمة بالاسم...">
      <span class="search-icon">⌕</span>
      <button class="clear-search" id="clearSearch">✕</button>
    </div>
  </header>

  
<section class="client-chat" aria-label="مساعد اختيار الخدمة">
  <div class="client-chat-title">🧑‍💼 وضع الموظف — قول أي كلام العميل قاله</div>
  <div class="client-chat-sub">اكتب كلام العميل زي ما هو بالظبط (عامي، مختصر، حتى لو فيه غلطة إملائية)، والبرنامج يفهم ويحدد الخدمة المناسبة له.</div>
  <div class="client-chat-row">
    <input id="clientIntentInput" class="client-chat-input"
           type="text" placeholder="مثال: عايز أنقل كفالة عامل..." autocomplete="off">
    <button id="clientIntentBtn" class="client-chat-btn">ساعدني</button>
  </div>
  <div class="quick-asks">
    <button class="quick-ask" data-ask="عايز أطلع إقامة">إصدار إقامة</button>
    <button class="quick-ask" data-ask="عايز أنقل كفالة عامل">نقل كفالة</button>
    <button class="quick-ask" data-ask="عايز أجدد رخصة">تجديد رخصة</button>
    <button class="quick-ask" data-ask="عايز خروج وعودة">خروج وعودة</button>
    <button class="quick-ask" data-ask="عايز أفتح ملف منشأة">فتح ملف منشأة</button>
  </div>
  <div id="clientIntentResult" class="chat-result"></div>
  <div class="chat-hint">💡 مش لازم تكتب اسم الخدمة بالحرف — اكتب اللي العميل قاله زي ما هو، حتى لو كلام عادي أو فيه غلط إملائي.</div>
</section>
<main id="main"></main>
</div>

<script>

function showToast(msg){
  const t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._tid);
  showToast._tid = setTimeout(() => t.classList.remove('show'), 1600);
}

function copyText(text, okMsg){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(() => showToast(okMsg || 'تم النسخ ✅'))
      .catch(() => showToast('مش قادر أنسخ، جرب تاني'));
  }else{
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); showToast(okMsg || 'تم النسخ ✅'); }catch(e){ showToast('مش قادر أنسخ'); }
    document.body.removeChild(ta);
  }
}

function extractDurations(conditions){
  const found = new Set();
  (conditions||[]).forEach(c => {
    let m; const re = new RegExp(DAY_RE);
    while((m = re.exec(c)) !== null){ found.add(parseInt(m[1],10)); }
  });
  return Array.from(found).filter(n => n >= 7).sort((a,b)=>b-a);
}

function isFavorite(id){ return STORE.favorites.includes(id); }
function toggleFavorite(id){
  const i = STORE.favorites.indexOf(id);
  if(i === -1) STORE.favorites.push(id); else STORE.favorites.splice(i,1);
  saveStore();
}

const darkToggleBtn = document.getElementById('darkToggle');
function applyDarkMode(){
  document.body.classList.toggle('dark', !!STORE.dark);
  if(darkToggleBtn) darkToggleBtn.textContent = STORE.dark ? '☀️' : '🌙';
}
applyDarkMode();
if(darkToggleBtn){
  darkToggleBtn.addEventListener('click', () => {
    STORE.dark = !STORE.dark;
    saveStore();
    applyDarkMode();
  });
}

const mainEl = document.getElementById('main');
const backBtn = document.getElementById('backBtn');
const headerTitle = document.getElementById('headerTitle');
const headerSub = document.getElementById('headerSub');
const searchInput = document.getElementById('searchInput');
const clearSearchBtn = document.getElementById('clearSearch');

let state = { view: 'home', platform: null, serviceId: null };
let history = [];

function countByPlatform(p){
  return SERVICES.filter(s => s.platform === p).length;
}
function esc(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}
function extractFees(conditions){
  const found = new Set();
  (conditions||[]).forEach(c => {
    const matches = c.match(FEE_RE);
    if(matches) matches.forEach(m => found.add(m.trim()));
  });
  return Array.from(found);
}

function go(next){
  history.push(state);
  state = next;
  if(state.view === 'detail' && state.serviceId){
    STORE.lastServiceId = state.serviceId;
    saveStore();
    try{ window.history.replaceState(null, '', '#service-' + state.serviceId); }catch(e){}
  }
  render();
}
function goBack(){
  state = history.length ? history.pop() : { view:'home', platform:null, serviceId:null };
  try{
    if(state.view === 'detail' && state.serviceId){
      window.history.replaceState(null, '', '#service-' + state.serviceId);
    } else {
      window.history.replaceState(null, '', window.location.pathname + window.location.search);
    }
  }catch(e){}
  render();
}
backBtn.addEventListener('click', goBack);

searchInput.addEventListener('input', () => {
  clearSearchBtn.style.display = searchInput.value.trim() ? 'block' : 'none';
  if(searchInput.value.trim()){
    if(state.view !== 'search') history.push(state);
    state = { view:'search', platform:null, serviceId:null };
  } else if (state.view === 'search'){
    state = history.length ? history.pop() : { view:'home' };
  }
  render();
});
clearSearchBtn.addEventListener('click', () => {
  searchInput.value = '';
  clearSearchBtn.style.display = 'none';
  state = { view:'home', platform:null, serviceId:null };
  history = [];
  render();
});

function renderHome(){
  backBtn.style.display = 'none';
  headerTitle.textContent = 'دليل الخدمات الحكومية';
  headerSub.textContent = SERVICES.length + ' خدمة جاهزة على طرف لسانك';

  const totalConditions = SERVICES.reduce((a,s)=>a+(s.conditions?s.conditions.length:0),0);
  const feeServices = SERVICES.filter(s => extractFees(s.conditions).length).length;

  let html = `
    <div class="stat-row">
      <div class="stat-chip"><div class="num">${SERVICES.length}</div><div class="lbl">خدمة</div></div>
      <div class="stat-chip"><div class="num">${PLATFORM_ORDER.length}</div><div class="lbl">منصات</div></div>
      <div class="stat-chip"><div class="num">${feeServices}</div><div class="lbl">فيها رسوم</div></div>
    </div>
  `;

  const favs = SERVICES.filter(s => isFavorite(s.id));
  if(favs.length){
    html += '<div class="fav-section"><div class="section-label">⭐ المفضلة عندك</div><div class="service-list">';
    favs.forEach((s, idx) => { html += serviceRowHTML(s, idx, true); });
    html += '</div></div>';
  }

  html += '<div class="section-label">اختار المنصة (١ - ' + PLATFORM_ORDER.length + ')</div>';
  html += '<div class="platform-grid">';
  PLATFORM_ORDER.forEach((p, idx) => {
    const meta = PLATFORM_META[p] || {icon:'📄'};
    html += `
      <div class="platform-card" data-platform="${esc(p)}">
        <div class="platform-num">${idx+1}</div>
        <div class="platform-info">
          <div class="platform-name">${meta.icon} ${esc(p)}</div>
          <div class="platform-count">${countByPlatform(p)} خدمة</div>
        </div>
      </div>`;
  });
  html += '</div>';
  mainEl.innerHTML = html;

  mainEl.querySelectorAll('.platform-card').forEach(card => {
    card.addEventListener('click', () => {
      go({ view:'platform', platform: card.dataset.platform, serviceId:null });
    });
  });
  wireFavButtons(mainEl);
  mainEl.querySelectorAll('.service-row').forEach(row => {
    row.addEventListener('click', (e) => {
      if(e.target.closest('.fav-star')) return;
      const svc = SERVICES.find(x => x.id === parseInt(row.dataset.id));
      if(svc) go({ view:'detail', platform: svc.platform, serviceId: svc.id });
    });
  });
}

function serviceRowHTML(s, idx, showPlatformTag){
  const meta = PLATFORM_META[s.platform] || {icon:'📄'};
  const fees = extractFees(s.conditions);
  const condCount = s.conditions ? s.conditions.length : 0;
  let metaHTML = '';
  if(showPlatformTag){
    metaHTML += `<span class="service-platform-tag">${meta.icon} ${esc(s.platform)}</span>`;
  }
  if(condCount){
    metaHTML += `<span class="meta-pill">⚠️ ${condCount} شرط</span>`;
  }
  if(fees.length){
    metaHTML += `<span class="meta-pill fee">💰 ${esc(fees[0])}${fees.length>1?' +':''}</span>`;
  }
  const favActive = isFavorite(s.id);
  return `
    <div class="service-row" data-id="${s.id}">
      <div class="service-num">${idx+1}</div>
      <div class="service-main">
        <div class="service-name">${esc(s.name)}</div>
        <div class="service-meta">${metaHTML}</div>
      </div>
      <button class="fav-star${favActive?' active':''}" data-fav-id="${s.id}" aria-label="مفضلة">${favActive?'★':'☆'}</button>
      <div class="chevron">‹</div>
    </div>`;
}

function wireFavButtons(container){
  container.querySelectorAll('.fav-star').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = parseInt(btn.dataset.favId);
      toggleFavorite(id);
      btn.classList.toggle('active');
      btn.textContent = isFavorite(id) ? '★' : '☆';
      if(state.view === 'home') renderHome();
    });
  });
}

function renderPlatformList(platform){
  backBtn.style.display = 'flex';
  headerTitle.textContent = platform;
  const list = SERVICES.filter(s => s.platform === platform);
  headerSub.textContent = list.length + ' خدمة — دوس على أي خدمة لعرض شروطها وخطواتها';

  let html = '<div class="service-list">';
  list.forEach((s, idx) => { html += serviceRowHTML(s, idx, false); });
  html += '</div>';
  mainEl.innerHTML = html;

  wireFavButtons(mainEl);
  mainEl.querySelectorAll('.service-row').forEach(row => {
    row.addEventListener('click', (e) => {
      if(e.target.closest('.fav-star')) return;
      go({ view:'detail', platform, serviceId: parseInt(row.dataset.id) });
    });
  });
}

function renderSearch(query){
  backBtn.style.display = history.length ? 'flex' : 'none';
  headerTitle.textContent = 'نتائج البحث';
  const q = query.trim();
  const results = SERVICES.filter(s => s.name.includes(q));
  headerSub.textContent = results.length + ' نتيجة لـ "' + q + '"';

  if(results.length === 0){
    mainEl.innerHTML = `<div class="empty-state"><div class="big">🔍</div>مفيش خدمة بالاسم ده<br>جرب كلمة تانية</div>`;
    return;
  }

  let html = '<div class="service-list">';
  results.forEach((s, idx) => { html += serviceRowHTML(s, idx, true); });
  html += '</div>';
  mainEl.innerHTML = html;

  wireFavButtons(mainEl);
  mainEl.querySelectorAll('.service-row').forEach(row => {
    row.addEventListener('click', (e) => {
      if(e.target.closest('.fav-star')) return;
      const svc = SERVICES.find(x => x.id === parseInt(row.dataset.id));
      go({ view:'detail', platform: svc.platform, serviceId: svc.id });
    });
  });
}

function renderDetail(serviceId){
  const s = SERVICES.find(x => x.id === serviceId);
  if(!s){ renderHome(); return; }
  backBtn.style.display = 'flex';
  headerTitle.textContent = s.platform;
  headerSub.textContent = 'تفاصيل الخدمة، الشروط، والخطوات';

  const favActive = isFavorite(s.id);
  let html = `
    <div class="detail-title-row">
      <div class="detail-title">${esc(s.name)}</div>
      <button class="fav-star${favActive?' active':''}" data-fav-id="${s.id}" aria-label="مفضلة" style="font-size:24px;">${favActive?'★':'☆'}</button>
    </div>`;

  const meta = PLATFORM_META[s.platform] || {};
  if(meta.site){
    html += `<a class="site-link-btn" href="${meta.site}" target="_blank" rel="noopener">🌐 فتح موقع ${esc(s.platform)}</a>`;
  }

  const fees = extractFees(s.conditions);
  const durations = extractDurations(s.conditions);

  if(s.conditions && s.conditions.length){
    html += `
      <div class="block-label">
        <span class="block-label-text"><span class="block-icon">⚠️</span> الشروط المهمة (تأكد منها الأول)</span>
        <button class="reset-link" id="resetConds">إعادة تعيين</button>
      </div>`;
    if(fees.length){
      html += '<div class="fee-row">';
      fees.forEach(f => { html += `<div class="fee-chip">💰 ${esc(f)}</div>`; });
      html += '</div>';
    }
    html += '<div class="cond-list" id="condList">';
    const doneC = (STORE.doneConds[s.id] || []);
    s.conditions.forEach((c, idx) => {
      html += `
        <div class="cond-item${doneC.includes(idx)?' done':''}" data-idx="${idx}">
          <div class="cond-badge">${idx+1}</div>
          <div class="cond-text">${esc(c)}</div>
        </div>`;
    });
    html += '</div>';

    if(durations.length){
      const maxDays = durations[0];
      html += `
        <div class="daycalc" id="daycalc" data-days="${maxDays}">
          <div class="daycalc-title">📅 حاسبة الأيام (${maxDays} يوم)</div>
          <div class="daycalc-row">
            <span>تاريخ البداية:</span>
            <input type="date" id="daycalcStart">
          </div>
          <div class="daycalc-result" id="daycalcResult"></div>
        </div>`;
    }
  }

  if(s.script){
    html += `
      <div class="block-label"><span class="block-label-text"><span class="block-icon">💬</span> إيه اللي تقوله للعميل</span></div>
      <div class="script-card">${esc(s.script)}</div>
      <div class="script-actions"><button class="copy-btn" id="copyScript">📋 نسخ الرد</button></div>`;
  }

  if(s.steps && s.steps.length){
    html += `
      <div class="block-label">
        <span class="block-label-text"><span class="block-icon">✅</span> خطوات التنفيذ</span>
        <button class="reset-link" id="resetSteps">إعادة تعيين</button>
      </div>`;
    html += '<div class="steps-list" id="stepsList">';
    const doneS = (STORE.doneSteps[s.id] || []);
    s.steps.forEach((step, idx) => {
      html += `
        <div class="step-item${doneS.includes(idx)?' done':''}" data-idx="${idx}">
          <div class="step-badge">${idx+1}</div>
          <div class="step-text">${esc(step)}</div>
        </div>`;
    });
    html += '</div>';
    html += `<div class="steps-actions">
        <button class="copy-btn" id="copySteps">📋 نسخ الخطوات</button>
        <button class="copy-btn" id="shareLink">🔗 مشاركة الرابط</button>
      </div>`;
  }

  mainEl.innerHTML = html;

  wireFavButtons(mainEl);

  mainEl.querySelectorAll('.cond-item').forEach(item => {
    item.addEventListener('click', () => {
      const idx = parseInt(item.dataset.idx);
      item.classList.toggle('done');
      const arr = STORE.doneConds[s.id] || [];
      const i = arr.indexOf(idx);
      if(item.classList.contains('done')){ if(i===-1) arr.push(idx); }
      else { if(i!==-1) arr.splice(i,1); }
      STORE.doneConds[s.id] = arr;
      saveStore();
    });
  });
  mainEl.querySelectorAll('.step-item').forEach(item => {
    item.addEventListener('click', () => {
      const idx = parseInt(item.dataset.idx);
      item.classList.toggle('done');
      const arr = STORE.doneSteps[s.id] || [];
      const i = arr.indexOf(idx);
      if(item.classList.contains('done')){ if(i===-1) arr.push(idx); }
      else { if(i!==-1) arr.splice(i,1); }
      STORE.doneSteps[s.id] = arr;
      saveStore();
    });
  });
  const resetConds = document.getElementById('resetConds');
  if(resetConds){
    resetConds.addEventListener('click', () => {
      mainEl.querySelectorAll('.cond-item.done').forEach(i => i.classList.remove('done'));
      STORE.doneConds[s.id] = [];
      saveStore();
    });
  }
  const resetSteps = document.getElementById('resetSteps');
  if(resetSteps){
    resetSteps.addEventListener('click', () => {
      mainEl.querySelectorAll('.step-item.done').forEach(i => i.classList.remove('done'));
      STORE.doneSteps[s.id] = [];
      saveStore();
    });
  }

  const copyScript = document.getElementById('copyScript');
  if(copyScript){
    copyScript.addEventListener('click', () => copyText(s.script, 'تم نسخ الرد ✅'));
  }
  const copySteps = document.getElementById('copySteps');
  if(copySteps){
    copySteps.addEventListener('click', () => {
      const text = s.steps.map((st,i)=>(i+1)+'. '+st).join('\n');
      copyText(text, 'تم نسخ الخطوات ✅');
    });
  }
  const shareLink = document.getElementById('shareLink');
  if(shareLink){
    shareLink.addEventListener('click', () => copyText(window.location.href, 'تم نسخ الرابط ✅'));
  }

  const daycalcStart = document.getElementById('daycalcStart');
  if(daycalcStart){
    const daycalcEl = document.getElementById('daycalc');
    const days = parseInt(daycalcEl.dataset.days, 10);
    const resultEl = document.getElementById('daycalcResult');
    daycalcStart.addEventListener('change', () => {
      if(!daycalcStart.value){ resultEl.textContent = ''; return; }
      const start = new Date(daycalcStart.value + 'T00:00:00');
      const end = new Date(start.getTime() + days*24*60*60*1000);
      const today = new Date(); today.setHours(0,0,0,0);
      const remaining = Math.ceil((end - today) / (24*60*60*1000));
      const endStr = end.toLocaleDateString('ar-EG', {year:'numeric', month:'long', day:'numeric'});
      let remainingHTML = '';
      if(remaining > 0){
        remainingHTML = `— <span class="days-left">باقي ${remaining} يوم</span>`;
      } else {
        remainingHTML = `— <span class="days-left">خلصت المدة</span>`;
      }
      resultEl.innerHTML = `تاريخ الانتهاء: ${endStr} ${remainingHTML}`;
    });
  }
}

function render(){
  clearSearchBtn.style.display = searchInput.value.trim() ? 'block' : 'none';
  if(state.view === 'home') renderHome();
  else if(state.view === 'platform') renderPlatformList(state.platform);
  else if(state.view === 'detail') renderDetail(state.serviceId);
  else if(state.view === 'search') renderSearch(searchInput.value);
  window.scrollTo(0,0);
}

/* Deep link: #service-<id> opens that service directly on load */
(function initFromHash(){
  const m = window.location.hash.match(/^#service-(\d+)$/);
  if(m){
    const svc = SERVICES.find(x => x.id === parseInt(m[1], 10));
    if(svc){ state = { view:'detail', platform: svc.platform, serviceId: svc.id }; }
  }
})();

render();
</script>

    'فيش':['تقارير ابشر'], 'تشبيه':['تقارير ابشر'], 'بيان حاله':['تقارير ابشر'],
    'عنوان':['العنوان الوطني'], 'رمز بريدي':['العنوان الوطني'],
    'تابع':['خدمات التابعين'], 'ابني':['خدمات التابعين'], 'مرافق':['خدمات التابعين'],
    'استعلام':['الاستعلامات'], 'منع سفر':['ايقاف الخدمات'], 'ايقاف':['ايقاف الخدمات'],
    'بوسطه':['توصيل وثائق بالبريد'], 'بريد':['توصيل وثائق'],
    'عقار':['تملك العقار'], 'فيلا':['تملك العقار'], 'شقه':['تملك العقار'],
    'اقامه':['اقامه','تجديد اقامه'], 'تجديد':['تجديد اقامه'],
    'طلوع نهائي':['خروج نهائي'], 'سفر نهائي':['خروج نهائي'], 'خروج':['خروج'], 'نهائي':['خروج نهائي'],
    'طلعه ورجعه':['خروج وعوده'], 'عوده':['خروج وعوده'],
    'اسم مترجم':['تعديل الاسم المترجم'], 'اسم غلط':['تعديل الاسم المترجم'],
    'هربت':['اسقاط عامل'], 'مارجعش':['اسقاط عامل'],
    'خادمه':['عماله منزليه'], 'شغاله':['عماله منزليه'], 'سائق':['عماله منزليه'],
    'مربيه':['عماله منزليه'], 'تحويل الخادمه':['نقل عماله منزليه الي مؤسسه'],
    'تأمينات':['التأمينات'], 'تامينات':['التأمينات'], 'قوى':['قوي'],
    'ابشر':['ابشر'], 'جوازات':['الجوازات']
  };

  function scoreService(query, s){
    const q = normalizeArabic(query);
    const qt = tokens(query);
    const name = normalizeArabic(s.name);
    const platform = normalizeArabic(s.platform);
    const condsText = normalizeArabic((s.conditions||[]).join(' '));
    const stepsText = normalizeArabic((s.steps||[]).join(' '));
    let score = 0;

    if(q && name.includes(q)) score += 30;
    qt.forEach(t => {
      if(name.includes(t)) score += 9;
      else if(platform.includes(t)) score += 3;
      else if(condsText.includes(t)) score += 4;
      else if(stepsText.includes(t)) score += 1.5;
    });

    qt.forEach(t => {
      (ALIASES[t]||[]).forEach(a => {
        const na = normalizeArabic(a);
        if(name.includes(na)) score += 12;
        else if(condsText.includes(na)) score += 6;
      });
    });

    if((q.includes('قوي')) && platform.includes('قوي')) score += 15;
    if((q.includes('تأمينات')||q.includes('تامينات')) && platform.includes('تأمينات')) score += 15;
    if(q.includes('ابشر') && platform.includes('ابشر')) score += 15;
    if(q.includes('مساند') && platform.includes('مساند')) score += 15;
    if(q.includes('جواز') && platform.includes('جوازات')) score += 10;

    return score;
  }

  function findMatches(query){
    if(!query.trim()) return [];
    const scored = SERVICES.map(s => ({s, score:scoreService(query,s)}))
      .sort((a,b)=>b.score-a.score);
    const withScore = scored.filter(x => x.score > 0);
    return (withScore.length ? withScore : scored).slice(0, withScore.length ? 4 : 3);
  }

  function openService(id){
    const svc = SERVICES.find(x=>x.id===id);
    if(!svc) return;
    if(typeof go === 'function'){
      go({view:'detail', platform:svc.platform, serviceId:svc.id});
    }
    window.scrollTo({top:0,behavior:'smooth'});
  }

  function run(){
    const q = input.value.trim();
    result.style.display = 'block';

    if(!q){
      result.innerHTML = '<div class="chat-empty">اكتب كلام العميل زي ما قاله 😊</div>';
      return;
    }

    const matches = findMatches(q);
    const confident = matches.length && scoreService(q, matches[0].s) >= 8;

    if(!confident){
      let html =
        '<strong>تمام يا فندم ❤️</strong><br>' +
        'مش متأكد أوي، بس ده أقرب اللي عندي لـ <b>' + escapeHtml(q) + '</b>:';
      matches.slice(0,3).forEach(m => {
        html += '<div class="chat-service" data-service-id="'+m.s.id+'">' +
          '<div class="chat-service-name">'+escapeHtml(m.s.name)+'</div>' +
          '<div class="chat-service-platform">'+escapeHtml(m.s.platform)+'</div>' +
          '</div>';
      });
      html += '<div style="margin-top:9px;font-size:12px">لو مفيش حاجة مناسبة، جرّب تكتب كلام العميل بتفصيل أكتر.</div>';
      result.innerHTML = html;
      result.querySelectorAll('[data-service-id]').forEach(el=>{
        el.addEventListener('click',()=>openService(parseInt(el.dataset.serviceId)));
      });
      return;
    }

    const top = matches[0];
    let html =
      '<strong>تمام يا فندم ❤️</strong><br>' +
      'فهمت إن حضرتك عايز <b>' + escapeHtml(q) + '</b>.' +
      '<br>أقرب خدمة عندي هي:';

    html += '<div class="chat-service" data-service-id="'+top.s.id+'">' +
      '<div class="chat-service-name">📌 '+escapeHtml(top.s.name)+'</div>' +
      '<div class="chat-service-platform">'+escapeHtml(top.s.platform)+'</div>' +
      '</div>';

    if(matches.length > 1){
      html += '<div style="margin-top:9px;font-size:12px">ولو مش دي المقصودة، ممكن تكون:</div>';
      matches.slice(1,3).forEach(m => {
        html += '<div class="chat-service" data-service-id="'+m.s.id+'">' +
          '<div class="chat-service-name">'+escapeHtml(m.s.name)+'</div>' +
          '<div class="chat-service-platform">'+escapeHtml(m.s.platform)+'</div>' +
          '</div>';
      });
    }

    html += '<div style="margin-top:9px;font-size:12px">دوس على الخدمة عشان تشوف الرد الجاهز والشروط والخطوات 👌</div>';
    result.innerHTML = html;

    result.querySelectorAll('[data-service-id]').forEach(el=>{
      el.addEventListener('click',()=>openService(parseInt(el.dataset.serviceId)));
    });
  }

  function escapeHtml(s){
    const d=document.createElement('div');
    d.textContent=s;
    return d.innerHTML;
  }

  btn.addEventListener('click',run);
  input.addEventListener('keydown',e=>{if(e.key==='Enter') run();});
  document.querySelectorAll('.quick-ask').forEach(b=>{
    b.addEventListener('click',()=>{
      input.value=b.dataset.ask;
      run();
    });
  });
})();
</script>
</body>
</html>
